<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · ARVENTA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/estilos.css?v=94f9e4828d">
<link rel="stylesheet" href="/assets/paginas.css?v=41e421edec">
<link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
</head>
<body>
<header class="barra-sup"><a class="marca" href="/">ARVENTA</a><span><a href="/reporte.html">Reporte</a> · <button type="button" class="enlace" id="salir" hidden>Salir</button></span></header>
<main class="pag ancha">
  <section id="acceso" class="acceso" hidden>
    <h1>Tu panel</h1>
    <form class="form" id="form-clave">
      <label for="clave">Clave de ARVENTA</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <p class="form-error" id="clave-error" role="alert" hidden></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>
  <section id="panel" hidden>
    <h1 style="margin-bottom:6px">Solicitudes</h1>
    <div class="controles-panel">
      <label>Estado<select id="f-estado"><option value="">Todas</option><option value="nueva">Nuevas</option><option value="verificada">Verificadas</option><option value="enviada">Enviadas</option><option value="visita_hecha">Visita hecha</option><option value="invalida">Inválidas</option></select></label>
      <label>Periodo<select id="f-dias"><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option><option value="365">1 año</option></select></label>
      <button class="btn claro" type="button" id="recargar">Actualizar</button>
    </div>
    <p class="alerta-panel" id="sin-api" hidden>Los WhatsApp automáticos todavía no están activos (falta conectar la API de WhatsApp). Los botones abren WhatsApp con el mensaje listo para que lo mandes tú.</p>
    <div id="resumen"></div>
    <div id="lista" aria-live="polite"></div>
  </section>
</main>
<script src="/assets/config.js?v=f4301134d5" data-medir="no"></script>
<script src="/assets/datos.js?v=67de0e0ef6"></script>
<script src="/assets/panel.js?v=35c2d1856c"></script>
</body>
</html>
