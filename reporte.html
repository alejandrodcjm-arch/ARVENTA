<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de interés · ARVENTA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/assets/estilos.css?v=4eb8feec4f">
<link rel="stylesheet" href="/assets/paginas.css?v=41e421edec">
<link rel="icon" href="/assets/icono.svg" type="image/svg+xml">
<style>
  :root{--serie:#16806A;--serie-suave:#E2F1EC;--rejilla:#E3E9EC}
  .controles{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:8px 0 20px}
  .controles label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--tinta-suave)}
  .controles select{padding:9px 12px;border:1px solid var(--niebla);border-radius:10px;background:#fff;font-size:16px;min-width:180px}
  .controles .btn{padding:10px 14px}
  .demo{background:#FFE9A8;border:2px dashed #C99400;border-radius:var(--radio);padding:12px 16px;font-weight:700;margin:0 0 16px}
  .alerta{background:#F7E9E4;color:#6E3527;border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 16px}
  .subtitulo{color:var(--tinta-suave);margin:-6px 0 18px}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tile{background:#fff;border:1px solid var(--niebla);border-radius:var(--radio);padding:14px 16px}
  .tile .et{font-size:14px;color:var(--tinta-suave)}
  .tile .v{font-family:var(--texto);font-weight:700;font-size:34px;line-height:1.1;margin-top:4px;display:block}
  .tile .nota{margin-top:4px}
  .tile.hero{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .tile.hero .et,.tile.hero .nota{color:rgba(255,255,255,.8)}
  .tile.hero .v{font-size:48px}
  @media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.tile .v{font-size:28px}.tile.hero .v{font-size:40px}}
  .seccion{margin-top:34px;break-inside:avoid}
  .seccion h2{margin:0 0 4px}
  .seccion > .nota{margin:0 0 12px}
  .dos-col{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  @media (max-width:760px){.dos-col{grid-template-columns:1fr}}
  /* Columnas por semana */
  .graf{position:relative;padding:8px 0 0 34px}
  .graf .eje-y{position:absolute;left:0;top:8px;bottom:26px;width:28px;font-size:12px;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
  .graf .eje-y span{position:absolute;right:0;transform:translateY(-50%)}
  .cols{height:180px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #C9D3D8;background:linear-gradient(var(--rejilla),var(--rejilla)) 0 0/100% 1px no-repeat}
  .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;outline-offset:-2px;cursor:default}
  .col .c{width:100%;max-width:24px;background:var(--serie);border-radius:4px 4px 0 0;min-height:0}
  .col .etq{position:absolute;font-size:12px;font-weight:700;color:var(--tinta);transform:translateY(-4px)}
  .col:hover .c,.col:focus .c{filter:brightness(.85)}
  .eje-x{display:flex;gap:2px;font-size:12px;color:var(--tinta-suave);height:26px;padding-top:4px}
  .eje-x span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
  .tip{position:fixed;z-index:2000;background:var(--tinta);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
  /* Barras horizontales */
  .barras{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .barras li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
  .barras .et{font-size:15px}
  .barras .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
  .barras .val small{font-weight:400;color:var(--tinta-suave)}
  .barras .riel{grid-column:1/-1;height:12px}
  .barras .barra{display:block;height:12px;background:var(--serie);border-radius:0 4px 4px 0;min-width:2px}
  /* Tabla por desarrollo */
  .tabla{width:100%;border-collapse:collapse;font-size:15px}
  .tabla th{text-align:left;font-size:13px;color:var(--tinta-suave);font-weight:700;padding:8px 8px;border-bottom:1px solid #C9D3D8}
  .tabla td{padding:9px 8px;border-bottom:1px solid var(--niebla);font-variant-numeric:tabular-nums;vertical-align:middle}
  .tabla td.n,.tabla th.n{text-align:right}
  .tabla .mini{display:inline-block;height:10px;background:var(--serie);border-radius:0 4px 4px 0;vertical-align:middle;margin-right:8px;min-width:2px}
  .tabla-envoltura{overflow-x:auto}
  #mapa-zonas{height:360px;border-radius:var(--radio);border:1px solid var(--niebla);background:var(--cielo)}
  .lugares{list-style:none;padding:0;margin:12px 0 0}
  .lugares li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--niebla)}
  .metodo{font-size:13px;color:var(--tinta-suave);margin-top:40px;border-top:1px solid var(--niebla);padding-top:14px}
  .metodo li{margin:4px 0;max-width:none}
  .acceso{max-width:420px}
  .vacio-graf{color:var(--tinta-suave);font-size:15px;padding:16px 0}
  @media print{
    .no-imprimir,.barra-sup,.pie-pag{display:none!important}
    body{background:#fff}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pag{padding-top:0}
    .seccion{page-break-inside:avoid}
  }
</style>
</head>
<body>
<header class="barra-sup"><a class="marca" href="/">ARVENTA</a><span style="color:var(--tinta-suave);font-weight:700">Reporte de interés</span></header>
<main class="pag ancha">
  <section id="acceso" class="acceso" hidden>
    <h1>Reporte de interés</h1>
    <p>Escribe la clave del reporte (la variable REPORTE_CLAVE en Vercel).</p>
    <form class="form" id="form-clave">
      <label for="clave">Clave</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <p class="form-error" id="clave-error" role="alert" hidden></p>
      <button class="btn" type="submit">Ver reporte</button>
    </form>
    <p style="margin-top:18px">¿Aún no tienes datos? <a href="#demo" id="ver-demo">Ver un ejemplo</a></p>
  </section>

  <section id="reporte" hidden>
    <div class="controles no-imprimir">
      <label>Desarrollo<select id="sel-desarrollo"></select></label>
      <label>Periodo<select id="sel-dias"><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Último año</option></select></label>
      <button class="btn" type="button" id="imprimir">Imprimir o guardar PDF</button>
      <button class="btn claro" type="button" id="salir">Salir</button>
    </div>
    <div id="contenido" aria-live="polite"></div>
  </section>
</main>
<footer class="pie-pag" data-pie></footer>
<div class="tip" id="tip" hidden></div>

<script src="/assets/config.js?v=9b7b9d4b81" data-medir="no"></script>
<script src="/assets/datos.js?v=21395bf165"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/assets/reporte.js?v=0cb363376a"></script>
</body>
</html>
