# Validar + construir + probar en cada cambio. Si falla, no se publica:
# en GitHub → Settings → Branches, protege "main" y exige que pase "Revisar y probar".
name: Revisar y probar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  revisar:
    name: Revisar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validar datos
        run: node scripts/validar.mjs
      - name: Las páginas generadas están al día
        run: |
          node scripts/construir.mjs --sin-imagenes
          git diff --exit-code -- . ':(exclude)*.png' || (echo "::error::Corre 'node scripts/construir.mjs' y sube los cambios." && exit 1)
      - name: Pruebas de /api
        run: node --test tests/api.test.mjs tests/citas.test.mjs
      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas del sitio
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: reporte-pruebas, path: test-results/, retention-days: 7 }
