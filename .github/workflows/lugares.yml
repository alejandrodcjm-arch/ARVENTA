# Cada lunes actualiza los lugares cercanos desde OpenStreetMap. Si Overpass falla, no cambia nada.
name: Actualizar lugares cercanos
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lugares:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/lugares.mjs
      - run: node scripts/construir.mjs --sin-imagenes
      - name: Subir si cambió
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "arventa-bot"
          git config user.email "arventa-bot@users.noreply.github.com"
          git commit -am "Actualiza lugares cercanos desde OpenStreetMap"
          git push
